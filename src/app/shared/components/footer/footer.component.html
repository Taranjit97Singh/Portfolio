<footer class="footer" *ngIf="profile">
  <div class="container footer-content">
    <div class="footer-brand">
      <a routerLink="/home" class="logo">
        <span class="logo-code"></span>Taranjit Singh<span class="logo-code"></span>
      </a>
      <p class="footer-title">{{ profile.title }}</p>
      <p class="footer-desc">Building digital excellence through high-performance engineering.</p>
    </div>

    <div class="footer-socials">
      <h3>Connect</h3>
      <div class="social-links">
        <a [href]="profile.socials.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <!-- GitHub SVG -->
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.193 22 16.44 22 12.017 22 6.484 17.522 2 12 2z" />
          </svg>
        </a>
        <a [href]="profile.socials.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <!-- LinkedIn SVG -->
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
          </svg>
        </a>
        <a *ngIf="profile.socials.twitter" [href]="profile.socials.twitter" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
          <!-- Twitter/X SVG -->
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <div class="container bottom-container">
      <p>&copy; {{ currentYear }} {{ profile.name }}. All rights reserved.</p>
      <a href="#" class="scroll-top" (click)="scrollToTop($event)" title="Back to top" aria-label="Scroll back to the top of the page">
        Back to top
        <svg class="arrow-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
        </svg>
      </a>
    </div>
  </div>
</footer>
